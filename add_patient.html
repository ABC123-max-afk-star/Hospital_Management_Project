{% extends "base.html" %}
{% block title %}Add Patient{% endblock %}
{% block content %}
<h1>Add Patient</h1>
<div class="card">
<form method="POST">
  <div class="field">
    <label>Full Name</label>
    <input type="text" name="name" required>
  </div>
  <div class="field">
    <label>Age</label>
    <input type="number" name="age" required>
  </div>
  <div class="field">
    <label>Gender</label>
    <select name="gender">
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>
  </div>
  <div class="field">
    <label>Contact</label>
    <input type="text" name="contact">
  </div>

  <h3 style="margin-top:24px;">Vitals (for AI risk prediction)</h3>
  <div class="field">
    <label>Resting Blood Pressure (mmHg)</label>
    <input type="number" step="0.1" name="resting_bp" value="120">
  </div>
  <div class="field">
    <label>Cholesterol (mg/dL)</label>
    <input type="number" step="0.1" name="cholesterol" value="200">
  </div>
  <div class="field">
    <label>BMI</label>
    <input type="number" step="0.1" name="bmi" value="25">
  </div>
  <div class="field">
    <label>Max Heart Rate</label>
    <input type="number" step="0.1" name="max_heart_rate">
  </div>
  <div class="field">
    <label>Exercise Hours / Week</label>
    <input type="number" step="0.1" name="exercise_hours_week" value="2">
  </div>
  <div class="field checkbox-field">
    <input type="checkbox" name="smoker" id="smoker">
    <label for="smoker" style="margin:0;">Smoker</label>
  </div>
  <div class="field checkbox-field">
    <input type="checkbox" name="family_history" id="family_history">
    <label for="family_history" style="margin:0;">Family history of heart disease</label>
  </div>

  <button class="btn" type="submit">Save Patient &amp; Predict Risk</button>
</form>
</div>
{% endblock %}
